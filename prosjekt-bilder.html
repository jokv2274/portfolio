<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilder - Annisette</title>
    <meta name="description" content="Bilder - Bildegalleri">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h2 class="logo"><a href="index.html" class="logo-link">Annisette</a></h2>
            <ul class="nav-menu">
                <li><a href="om-meg.html" class="nav-link">Om meg</a></li>
                <li><a href="index.html#prosjekter" class="nav-link">Prosjekter</a></li>
                <li><a href="prosjekt-bilder.html" class="nav-link">Bilder</a></li>
                <li><a href="showreel.html" class="nav-link">Showreel</a></li>
                <li><a href="index.html" class="nav-link">Hjem</a></li>
            </ul>
        </div>
    </nav>

    <section class="carousel-section">
        <h2>Bilder</h2>
        <div class="carousel-container">
            <button class="carousel-btn prev" onclick="moveCarousel(-1)">‹</button>
            
            <div class="carousel-track">
                <div class="carousel-item carousel-prev-prev"><img src="8.png" alt="Bilde 8"></div>
                <div class="carousel-item carousel-prev"><img src="4.png" alt="Bilde 4"></div>
                <div class="carousel-item carousel-active"><img src="5.png" alt="Bilde 5"></div>
                <div class="carousel-item carousel-next"><img src="6.png" alt="Bilde 6"></div>
                <div class="carousel-item carousel-next-next"><img src="7.png" alt="Bilde 7"></div>
            </div>
            
            <button class="carousel-btn next" onclick="moveCarousel(1)">›</button>
        </div>
        
        <div class="carousel-indicators">
            <span class="indicator" onclick="goToSlide(0)"></span>
            <span class="indicator" onclick="goToSlide(1)"></span>
            <span class="indicator active" onclick="goToSlide(2)"></span>
            <span class="indicator" onclick="goToSlide(3)"></span>
            <span class="indicator" onclick="goToSlide(4)"></span>
        </div>
    </section>

    <script>
        let currentIndex = 2; // Middle item (0-4)
        const items = ['4.png', '5.png', '6.png', '7.png', '8.png'];
        
        function updateCarousel() {
            const track = document.querySelector('.carousel-track');
            const children = Array.from(track.children);
            const indicators = document.querySelectorAll('.indicator');
            
            // Update carousel item classes based on position
            children.forEach((child, i) => {
                child.className = 'carousel-item';
                if (i === 0) child.classList.add('carousel-prev-prev');
                else if (i === 1) child.classList.add('carousel-prev');
                else if (i === 2) child.classList.add('carousel-active');
                else if (i === 3) child.classList.add('carousel-next');
                else if (i === 4) child.classList.add('carousel-next-next');
            });
            
            // Update indicator states
            indicators.forEach((ind, i) => {
                if (i === currentIndex) {
                    ind.classList.add('active');
                } else {
                    ind.classList.remove('active');
                }
            });
        }
        
        function moveCarousel(direction) {
            currentIndex = (currentIndex + direction + items.length) % items.length;
            
            const track = document.querySelector('.carousel-track');
            
            if (direction === 1) {
                // Move right: take first, append to end
                track.appendChild(track.firstElementChild);
            } else {
                // Move left: take last, prepend to start
                track.prepend(track.lastElementChild);
            }
            
            updateCarousel();
        }
        
        function goToSlide(index) {
            const diff = index - currentIndex;
            if (diff === 0) return;
            
            if (diff > 0) {
                for (let i = 0; i < diff; i++) moveCarousel(1);
            } else {
                for (let i = 0; i < -diff; i++) moveCarousel(-1);
            }
        }
        
        // Keyboard navigation
        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowLeft') {
                moveCarousel(-1);
            } else if (event.key === 'ArrowRight') {
                moveCarousel(1);
            }
        });
        
        // Initialize on page load
        window.addEventListener('load', updateCarousel);
    </script>
</body>
</html>
