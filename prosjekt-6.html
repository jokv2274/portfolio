<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilder</title>
    <meta name="description" content="Bilder - Bildegalleri">
    <link rel="icon" type="image/png" href="assets/icons/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h2 class="logo"><a href="index.html" class="logo-link">Eiker Rock</a></h2>
            <ul class="nav-menu">
                <li><a href="index.html#prosjekter" class="nav-link">Prosjekter</a></li>
                <li><a href="prosjekt-6.html" class="nav-link">Bilder</a></li>
                <li><a href="om-meg.html" class="nav-link">Om meg</a></li>
                <li><a href="index.html" class="nav-link">Hjem</a></li>
            </ul>
        </div>
    </nav>

    <section class="carousel-section">
        <h1></h1>
        <div class="carousel-container">
            <button class="carousel-btn prev" onclick="moveCarousel(-1)">‹</button>
            
            <div class="carousel-track">
                <div class="carousel-item carousel-prev-prev"><img src="assets/images/eiker-rock/8.png" alt="Bilde 8" onclick="openLightbox(this)" draggable="false"></div>
                <div class="carousel-item carousel-prev"><img src="assets/images/eiker-rock/4.png" alt="Bilde 4" onclick="openLightbox(this)" draggable="false"></div>
                <div class="carousel-item carousel-active"><img src="assets/images/eiker-rock/5.png" alt="Bilde 5" onclick="openLightbox(this)" draggable="false"></div>
                <div class="carousel-item carousel-next"><img src="assets/images/eiker-rock/6.png" alt="Bilde 6" onclick="openLightbox(this)" draggable="false"></div>
                <div class="carousel-item carousel-next-next"><img src="assets/images/eiker-rock/7.png" alt="Bilde 7" onclick="openLightbox(this)" draggable="false"></div>
            </div>
            
            <button class="carousel-btn next" onclick="moveCarousel(1)">›</button>
        </div>
        
        <div class="carousel-indicators">
            <span class="indicator" onclick="goToSlide(0)"></span>
            <span class="indicator" onclick="goToSlide(1)"></span>
            <span class="indicator active" onclick="goToSlide(2)"></span>
            <span class="indicator" onclick="goToSlide(3)"></span>
            <span class="indicator" onclick="goToSlide(4)"></span>
        </div>
    </section>

    <!-- Lightbox modal -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <img id="lightbox-img" src="" alt="Full size image" onclick="closeLightbox()" style="cursor: pointer;" draggable="false">
        </div>
    </div>

    <script>
        let currentIndex = 2; // Middle item (0-4)
        const items = [
            'assets/images/eiker-rock/4.png',
            'assets/images/eiker-rock/5.png',
            'assets/images/eiker-rock/6.png',
            'assets/images/eiker-rock/7.png',
            'assets/images/eiker-rock/8.png'
        ];
        
        function updateCarousel() {
            const track = document.querySelector('.carousel-track');
            const children = Array.from(track.children);
            const indicators = document.querySelectorAll('.indicator');
            
            // Update carousel item classes based on position
            children.forEach((child, i) => {
                child.className = 'carousel-item';
                if (i === 0) child.classList.add('carousel-prev-prev');
                else if (i === 1) child.classList.add('carousel-prev');
                else if (i === 2) child.classList.add('carousel-active');
                else if (i === 3) child.classList.add('carousel-next');
                else if (i === 4) child.classList.add('carousel-next-next');
            });
            
            // Update indicator states
            indicators.forEach((ind, i) => {
                if (i === currentIndex) {
                    ind.classList.add('active');
                } else {
                    ind.classList.remove('active');
                }
            });
        }
        
        function moveCarousel(direction) {
            currentIndex = (currentIndex + direction + items.length) % items.length;
            
            const track = document.querySelector('.carousel-track');
            
            if (direction === 1) {
                // Move right: take first, append to end
                track.appendChild(track.firstElementChild);
            } else {
                // Move left: take last, prepend to start
                track.prepend(track.lastElementChild);
            }
            
            updateCarousel();
        }
        
        function goToSlide(index) {
            const diff = index - currentIndex;
            if (diff === 0) return;
            
            if (diff > 0) {
                for (let i = 0; i < diff; i++) moveCarousel(1);
            } else {
                for (let i = 0; i < -diff; i++) moveCarousel(-1);
            }
        }
        
        // Keyboard navigation
        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowLeft') {
                moveCarousel(-1);
            } else if (event.key === 'ArrowRight') {
                moveCarousel(1);
            } else if (event.key === 'Escape') {
                closeLightbox();
            }
        });
        
        // Lightbox functions
        function openLightbox(img) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = img.src;
            lightbox.style.display = 'flex';
        }
        
        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.style.display = 'none';
        }
        
        // Disable right-click context menu on images
        document.addEventListener('contextmenu', function(e) {
            const carousel = document.querySelector('.carousel-track');
            const lightboxImg = document.getElementById('lightbox-img');
            if (carousel && carousel.contains(e.target)) {
                e.preventDefault();
            }
            if (lightboxImg && lightboxImg === e.target) {
                e.preventDefault();
            }
        }, false);
        
        // Initialize on page load
        window.addEventListener('load', updateCarousel);
    </script>
</body>
</html>
