<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilder</title>
    <meta name="description" content="Bilder - Bildegalleri">
    <link rel="icon" type="image/png" href="assets/icons/favicon.png">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/bilde-4.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h2 class="logo"><a href="index.html" class="logo-link">Eiker Rock</a></h2>
            <ul class="nav-menu">
                <li><a href="index.html#prosjekter" class="nav-link">Prosjekter</a></li>
                <li><a href="prosjekt-5.html" class="nav-link">Bilder</a></li>
                <li><a href="om-meg.html" class="nav-link">Om meg</a></li>
                <li><a href="index.html" class="nav-link">Hjem</a></li>
            </ul>
        </div>
    </nav>

    <section class="gallery-section">
        <h1>Eiker Rock</h1>
        <div class="gallery-grid">
            <img src="assets/images/eiker-rock/4.png" alt="Eiker Rock 1" onclick="openLightbox(this)" style="cursor: pointer;" draggable="false">
            <img src="assets/images/eiker-rock/5.png" alt="Eiker Rock 2" onclick="openLightbox(this)" style="cursor: pointer;" draggable="false">
            <img src="assets/images/eiker-rock/6.png" alt="Eiker Rock 3" onclick="openLightbox(this)" style="cursor: pointer;" draggable="false">
            <img src="assets/images/eiker-rock/7.png" alt="Eiker Rock 4" onclick="openLightbox(this)" style="cursor: pointer;" draggable="false">
            <img src="assets/images/eiker-rock/8.png" alt="Eiker Rock 5" onclick="openLightbox(this)" style="cursor: pointer;" draggable="false">
        </div>
        <p style="text-align: center; margin-top: 40px;"><a href="prosjekt-5.html" class="cta-btn">Tilbake til Sideprosjekter</a></p>
    </section>

    <!-- Lightbox modal -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <button class="lightbox-nav prev" aria-label="Forrige">‹</button>
            <img id="lightbox-img" src="" alt="Full size image" onclick="closeLightbox()" style="cursor: pointer;" draggable="false">
            <button class="lightbox-nav next" aria-label="Neste">›</button>
        </div>
    </div>

    <script>
        (function() {
            const galleryImgs = Array.from(document.querySelectorAll('.gallery-grid img'));
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            let currentIndex = -1;

            function openLightbox(img) {
                currentIndex = galleryImgs.indexOf(img);
                if (currentIndex === -1) currentIndex = 0;
                lightboxImg.src = galleryImgs[currentIndex].src;
                lightbox.style.display = 'flex';
            }

            function closeLightbox() {
                lightbox.style.display = 'none';
            }

            function showAt(index) {
                if (index < 0) index = galleryImgs.length - 1;
                if (index >= galleryImgs.length) index = 0;
                currentIndex = index;
                lightboxImg.src = galleryImgs[currentIndex].src;
            }

            function next() { showAt(currentIndex + 1); }
            function prev() { showAt(currentIndex - 1); }

            window.openLightbox = function(img) { openLightbox(img); };
            window.closeLightbox = function() { closeLightbox(); };

            document.addEventListener('keydown', function(event) {
                if (lightbox.style.display !== 'flex') return;
                if (event.key === 'Escape') closeLightbox();
                if (event.key === 'ArrowRight') next();
                if (event.key === 'ArrowLeft') prev();
            });

            document.addEventListener('contextmenu', function(e) {
                if (lightboxImg && lightboxImg === e.target) e.preventDefault();
            }, false);

            const prevBtn = document.querySelector('.lightbox-nav.prev');
            const nextBtn = document.querySelector('.lightbox-nav.next');
            if (prevBtn) prevBtn.addEventListener('click', (e) => { e.stopPropagation(); prev(); });
            if (nextBtn) nextBtn.addEventListener('click', (e) => { e.stopPropagation(); next(); });
        })();
    </script>
    <footer class="site-footer">
        <div class="footer-inner">

        </div>
    </footer>
</body>
</html>
